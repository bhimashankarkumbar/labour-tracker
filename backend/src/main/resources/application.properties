# Spring Boot Application Properties
# These are defaults. Override with environment variables (DB_URL, DB_USERNAME, etc.)

spring.application.name=labour-tracker

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- MySQL DataSource ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/labour_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:shankar@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:defaultDevSecretKeyMustBeAtLeast64CharactersLongForHS512AlgorithmUsage12345}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ---- Logging ----
logging.level.com.labourtracker=INFO
logging.level.org.springframework.security=WARN
